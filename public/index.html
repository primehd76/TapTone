<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapTone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Dashboard Area -->
    <div id="play-mode-container">
        <!-- Header: Page Indicator & Settings Button -->
        <div class="top-bar">
            <span id="page-indicator">Page 1 / 5</span>
            <button id="btn-settings">⚙️ Edit Settings</button>

        <!-- 5x3 Button Grid Container -->
        <div class="grid-container" id="sound-grid">

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
