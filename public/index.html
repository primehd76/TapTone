<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapTone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-wrapper">
        <!-- PANEL KIRI -->
        <aside id="sidebar-left" class="panel">
            <div class="panel-header">
                <h3>Library & Profiles</h3>
            </div>
            <div class="panel-content">
                <label>Active Profile:</label>
                <div class="profile-group">
                    <select id="profile-select">
                        <!-- Otomatis diisi oleh backend -->
                    </select>
                    <button id="btn-new-profile" title="New Profile" class="icon-btn">➕</button>
                    <button id="btn-del-profile" title="Delete Profile" class="icon-btn danger">🗑️</button>
                </div>
                <hr>
                <div class="library-header">
                    <h4>Sound Files (.wav)</h4>
                    <button id="btn-upload-sound" class="action-btn">+ Upload</button>
                    <input type="file" id="file-upload-input" accept=".wav" style="display: none;">
                </div>

                <!-- TAMBAHKAN KODE INI TEPAT DI BAWAH LIBRARY HEADER -->
                <div id="upload-progress-container" style="display: none;">
                    <div id="upload-progress-bar"></div>
                </div>
                <!-- ------------------------------------------------ -->

                <ul id="audio-list" class="file-list">
            </div>
        </aside>

        <!-- AREA UTAMA -->
        <main id="main-area">
            <div class="top-bar">
                <span id="page-indicator">Profile: <span id="current-profile-name">Loading...</span></span>
                <button id="btn-settings">⚙️ Edit Settings</button>
            </div>

            <div class="main-content">
                <div class="grid-container" id="sound-grid">
                    <!-- Grid generated via JS -->
                </div>
            </div>

            <!-- PANEL BAWAH -->
            <section id="panel-bottom" class="panel">
                <div class="config-grid">
                    <div class="config-col">
                        <h4>Button Config <span id="selected-btn-id">(None)</span></h4>
                        <label>Button Name:</label>
                        <input type="text" id="input-btn-name" placeholder="Enter name...">
                        <label>Action Type:</label>
                        <select id="select-action-type">
                            <option value="blank">Blank / None</option>
                            <option value="play_sound">Play Sound</option>
                            <option value="stop_all">Stop All Sounds</option>
                        </select>
                    </div>
                    <div class="config-col">
                        <h4>Appearance</h4>
                        <label>Background Color:</label>
                        <input type="color" id="input-bg-color" value="#2a2d3e">
                    </div>
                    <div class="config-col">
                        <h4>Audio & Hardware</h4>
                        <label>Sound File:</label>
                        <input type="text" id="input-sound-file" placeholder="Drag file here or type..." readonly>
                        <label>MIDI Assignment:</label>
                        <div class="midi-group">
                            <input type="text" id="input-midi" placeholder="Click to assign..." readonly>
                            <button id="btn-clear-midi" class="action-btn danger">Clear</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
