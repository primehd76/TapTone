<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapTone - Broadcast Soundboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-wrapper">
        <!-- PANEL KIRI -->
        <aside id="sidebar-left" class="panel">
            <div class="panel-header">
                <h3>Library & Profiles</h3>
            </div>
            <div class="panel-content">
                <label>Active Profile:</label>
                <div class="profile-group">
                    <select id="profile-select"></select>
                    <button id="btn-new-profile" title="New Profile" class="icon-btn">➕</button>
                    <button id="btn-rename-profile" title="Rename Profile" class="icon-btn">✏️</button>
                    <button id="btn-del-profile" title="Delete Profile" class="icon-btn danger">🗑️</button>
                </div>
                <hr>
                <div class="library-header">
                    <h4>Sound Files (.wav)</h4>
                    <button id="btn-upload-sound" class="action-btn">+ Upload</button>
                    <input type="file" id="file-upload-input" accept=".wav" style="display: none;">
                </div>
                
                <div id="upload-progress-container" style="display: none;">
                    <div id="upload-progress-bar"></div>
                </div>
                
                <ul id="audio-list" class="file-list"></ul>
            </div>
        </aside>

        <!-- AREA UTAMA -->
        <main id="main-area">
            <div class="top-bar">
                <div class="page-nav-group">
                    <button id="btn-prev-page" class="icon-btn">◀</button>
                    <span id="page-indicator">Page 1 / 5</span>
                    <button id="btn-next-page" class="icon-btn">▶</button>
                </div>
                <!-- MIDI STATUS BADGE -->
                <div id="midi-status-badge" class="badge danger">🔴 MIDI: Not Connected</div>
                
                <div style="flex-grow: 1; text-align: center;">
                    <span class="profile-title">Profile: <span id="current-profile-name">Loading...</span></span>
                </div>
                <button id="btn-settings">⚙️ Edit Settings</button>
            </div>

            <div class="main-content">
                <div class="grid-container" id="sound-grid"></div>
            </div>

            <!-- PANEL BAWAH -->
            <section id="panel-bottom" class="panel">
                <div class="config-grid">
                    <div class="config-col">
                        <!-- TAMBAHAN TOMBOL RESET DI SINI -->
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h4 style="margin-bottom: 0;">Button Config <span id="selected-btn-id">(None)</span></h4>
                            <button id="btn-reset-button" class="action-btn danger" style="padding: 4px 8px; font-size: 11px;">Reset Button</button>
                        </div>
                        
                        <label>Button Name:</label>
                        <input type="text" id="input-btn-name" placeholder="Enter name...">
                        <label>Action Type:</label>
                        <select id="select-action-type">
                            <option value="blank">Blank / None</option>
                            <option value="play_sound">Play Sound</option>
                            <option value="stop_all">Stop All Sounds</option>
                            <option value="next_page">Next Page</option>
                            <option value="prev_page">Previous Page</option>
                        </select>
                    </div>
                    
                    <div class="config-col">
                        <h4>Appearance</h4>
                        <label>Display Mode:</label>
                        <select id="select-display-mode">
                            <option value="text">Text Only</option>
                            <option value="icon">Stock Icon</option>
                        </select>
                        <div id="icon-picker-container" style="display: none; margin-top: 8px;">
                            <label>Select Icon:</label>
                            <select id="select-stock-icon">
                                <option value="🔥">🔥 Fire</option>
                                <option value="👏">👏 Clap</option>
                                <option value="🎉">🎉 Party</option>
                                <option value="🚨">🚨 Alert</option>
                                <option value="😂">😂 Laugh</option>
                                <option value="⏰">⏰ Timer</option>
                                <option value="🎵">🎵 Music</option>
                                <option value="💥">💥 Boom</option>
                            </select>
                        </div>
                        <label>Background Color (Hex/RGB):</label>
                        <div class="color-group">
                            <input type="color" id="input-bg-color" value="#2a2d3e">
                            <input type="text" id="input-bg-hex" placeholder="#2a2d3e">
                        </div>
                        <label>Font Color (Hex/RGB):</label>
                        <div class="color-group">
                            <input type="color" id="input-font-color" value="#ffffff">
                            <input type="text" id="input-font-hex" placeholder="#ffffff">
                        </div>
                    </div>

                    <div class="config-col">
                        <h4>Audio & Hardware</h4>
                        <label>Sound File:</label>
                        <div class="midi-group">
                            <input type="text" id="input-sound-file" placeholder="Drag file here..." readonly>
                            <button id="btn-clear-sound" class="action-btn danger">Clear</button>
                        </div>
                        <label>MIDI Assignment:</label>
                        <div class="midi-group">
                            <input type="text" id="input-midi" placeholder="Click to assign..." readonly>
                            <button id="btn-clear-midi" class="action-btn danger">Clear</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
